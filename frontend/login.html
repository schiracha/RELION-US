<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RELION-US — Log in</title>
<!--
  Deliberately a single self-contained file (no shared style.css/app.js): it
  has to render and work even when everything else in frontend/ is behind
  the auth gate this page exists to get past (see backend/auth.py and
  main.py's auth_gate middleware), and it's simple enough that duplicating a
  few colors here is cheaper than carving out a shared, gate-exempt asset.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    background: #1b1e23; color: #e6e9ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }
  .card {
    width: 320px; max-width: calc(100vw - 32px);
    background: #23272e; border: 1px solid #384049; border-radius: 10px;
    overflow: hidden;
  }
  .card-head { background: #134394; color: #fff; padding: 16px 20px; }
  .card-head h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .card-head p { margin: 4px 0 0; font-size: 12px; color: #cfe0f7; }
  .card-body { padding: 20px; }
  label { display: block; font-size: 12px; color: #9aa4b2; margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; padding: 9px 10px; font-size: 14px;
    background: #2a2f38; border: 1px solid #384049; border-radius: 6px;
    color: #e6e9ee; margin-bottom: 12px;
  }
  input[type="password"]:focus { outline: none; border-color: #4f8cff; }
  button {
    width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
    background: #134394; color: #fff; border: none; border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #1c52ab; }
  button:disabled { opacity: .6; cursor: default; }
  .error {
    margin: 0 0 12px; font-size: 12px; color: #e2584d; min-height: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <h1>RELION-US</h1>
      <p>This instance is password-protected.</p>
    </div>
    <div class="card-body">
      <form id="loginForm" autocomplete="on">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autofocus autocomplete="current-password" />
        <p class="error" id="loginError"></p>
        <button type="submit" id="loginBtn">Log in</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById("loginForm");
    const errorEl = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");
    const passwordInput = document.getElementById("password");

    // If this browser already has a valid session (e.g. a bookmarked /login.html),
    // there's nothing to protect by making it re-enter the password.
    fetch("/api/project", { credentials: "same-origin" }).then((r) => {
      if (r.status !== 401) window.location.replace("/");
    }).catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      btn.disabled = true;
      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: passwordInput.value }),
        });
        if (resp.ok) {
          window.location.replace("/");
          return;
        }
        const data = await resp.json().catch(() => ({}));
        errorEl.textContent = data.detail || "Incorrect password.";
        passwordInput.value = "";
        passwordInput.focus();
      } catch (err) {
        errorEl.textContent = "Could not reach the server: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
